# ============================================================
# Media Server Stack
# ============================================================
# Services: qBittorrent, Prowlarr, Radarr, Sonarr, Jellyfin,
#           Jellyseerr, Bazarr, Recyclarr, Unpackerr,
#           Homepage, Uptime Kuma, Audiobookshelf, Cloudflared,
#           FlareSolverr
#
# FIRST RUN:
#   Run: bash install.sh   (does everything automatically)
# ============================================================

networks:
  mediaserver:
    driver: bridge

services:

  # ============================================================
  # Gluetun - VPN Gateway (NordVPN / WireGuard)
  # Every service except Jellyfin routes through it
  # (network_mode: "service:gluetun" below).
  # Built-in firewall = kill switch: if the VPN drops, traffic
  # stops instead of leaking out the normal connection.
  #
  # All services share this network namespace, so:
  #   - their published ports live on this container
  #   - they reach each other via localhost or service hostnames
  #     (the aliases below keep the old hostnames resolving)
  #   - after restarting gluetun alone, run `docker compose up -d`
  #     to re-attach the dependent containers
  # ============================================================
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      # Empty = no country filter: gluetun picks a random server
      # from NordVPN's full pool on every (re)start.
      - SERVER_COUNTRIES=${VPN_COUNTRY:-}
      # Allow LAN access to the WebUIs of all services behind the VPN
      - FIREWALL_INPUT_PORTS=8080,6881,7878,8989,9696,6767,5055,3000,3001,80,8191
    volumes:
      # Control-server auth (API key) — used by the Homepage VPN widget
      - ./config/gluetun:/gluetun/auth:ro
    ports:
      - "8080:8080"        # qBittorrent
      - "6881:6881"        # qBittorrent torrent
      - "6881:6881/udp"    # qBittorrent torrent
      - "7878:7878"        # Radarr
      - "8989:8989"        # Sonarr
      - "9696:9696"        # Prowlarr
      - "6767:6767"        # Bazarr
      - "5055:5055"        # Jellyseerr
      - "3000:3000"        # Homepage
      - "3001:3001"        # Uptime Kuma
      - "13378:80"         # Audiobookshelf
      - "8191:8191"        # FlareSolverr
    networks:
      mediaserver:
        # Old hostnames still resolve here (the services now live in
        # this container's network namespace) so existing references
        # in service configs and the Cloudflare tunnel keep working.
        aliases:
          - qbittorrent
          - radarr
          - sonarr
          - prowlarr
          - bazarr
          - jellyseerr
          - homepage
          - uptime-kuma
          - audiobookshelf
          - flaresolverr
    restart: unless-stopped

  # ============================================================
  # qBittorrent - Torrent Download Client
  # WebUI: http://localhost:8080  (default: admin / adminadmin)
  # All traffic goes through gluetun (NordVPN) — see above.
  # ============================================================
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ./config/qbittorrent:/config
      - "${DIR_DOWNLOADS}:/downloads"
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # Prowlarr - Indexer Manager
  # WebUI: http://localhost:9696
  # Connects to Radarr & Sonarr automatically via API
  # ============================================================
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/prowlarr:/config
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # Radarr - Movie Collection Manager
  # WebUI: http://localhost:7878
  # Download client: gluetun:8080 (qBittorrent behind the VPN)
  # Indexers: managed via Prowlarr
  # ============================================================
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /home/john/radarr-config:/config
      - "${DIR_MOVIES}:/movies"
      - "${DIR_DOWNLOADS}:/downloads"
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # Sonarr - TV Series Collection Manager
  # WebUI: http://localhost:8989
  # Download client: gluetun:8080 (qBittorrent behind the VPN)
  # Indexers: managed via Prowlarr
  # ============================================================
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/sonarr:/config
      - "${DIR_TV}:/tv"
      - "${DIR_DOWNLOADS}:/downloads"
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # Jellyfin - Media Server
  # WebUI: http://localhost:8096
  # Libraries: /data/movies and /data/tvshows
  # ============================================================
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/jellyfin:/config
      - "${DIR_MOVIES}:/data/movies"
      - "${DIR_TV}:/data/tvshows"
      - "${DIR_AUDIOBOOKS}:/data/audiobooks"
    ports:
      - "8096:8096"
      - "8920:8920"
      - "7359:7359/udp"
      # Uncomment below if you need DLNA support:
      # - "1900:1900/udp"
    # Intel VAAPI hardware transcoding (uncomment if no NVIDIA GPU):
    # devices:
    #   - /dev/dri:/dev/dri
    # NVIDIA GPU hardware transcoding (requires nvidia-container-toolkit):
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - mediaserver
    restart: unless-stopped

  # ============================================================
  # Seerr (formerly Jellyseerr) - Media Request Manager
  # WebUI: http://localhost:5055
  # Connects to: Jellyfin, Radarr, Sonarr
  # ============================================================
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: jellyseerr
    init: true
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=debug
    volumes:
      - ./config/jellyseerr:/app/config
    network_mode: "service:gluetun"
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
      jellyfin:
        condition: service_started
      radarr:
        condition: service_started
      sonarr:
        condition: service_started

  # ============================================================
  # Bazarr - Subtitle Manager
  # WebUI: http://localhost:6767
  # Connects to: Radarr (movies) and Sonarr (TV)
  # ============================================================
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/bazarr:/config
      - "${DIR_MOVIES}:/movies"
      - "${DIR_TV}:/tv"
    network_mode: "service:gluetun"
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
      radarr:
        condition: service_started
      sonarr:
        condition: service_started

  # ============================================================
  # Recyclarr - Radarr/Sonarr Quality Profile Sync
  # No WebUI - runs on a schedule (daily at 03:00)
  # Config: ./config/recyclarr/recyclarr.yml
  # Fill in API keys in .env first!
  # ============================================================
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    container_name: recyclarr
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
      - CRON_SCHEDULE=0 3 * * *
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_API_KEY=${RADARR_API_KEY}
    volumes:
      - ./config/recyclarr:/config
    network_mode: "service:gluetun"
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
      radarr:
        condition: service_started
      sonarr:
        condition: service_started

  # ============================================================
  # Unpackerr - Extracts Completed Downloads
  # No WebUI - monitors download folder and extracts archives
  # Notifies Radarr/Sonarr when extraction is complete
  # Fill in API keys in .env first!
  # ============================================================
  unpackerr:
    image: golift/unpackerr:latest
    container_name: unpackerr
    environment:
      - TZ=${TZ}
      - UN_DEBUG=false
      - UN_LOG_FILE=/downloads/unpackerr.log
      # Sonarr
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_SONARR_0_PATHS_0=/downloads
      - UN_SONARR_0_PROTOCOLS=torrent
      - UN_SONARR_0_DELETE_ORIG=false
      - UN_SONARR_0_DELETE_DELAY=5m
      # Radarr
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
      - UN_RADARR_0_PATHS_0=/downloads
      - UN_RADARR_0_PROTOCOLS=torrent
      - UN_RADARR_0_DELETE_ORIG=false
      - UN_RADARR_0_DELETE_DELAY=5m
    volumes:
      - "${DIR_DOWNLOADS}:/downloads"
    network_mode: "service:gluetun"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
      radarr:
        condition: service_started
      sonarr:
        condition: service_started
      qbittorrent:
        condition: service_started

  # ============================================================
  # Homepage - Dashboard
  # WebUI: http://localhost:3000
  # Config: ./config/homepage/
  # ============================================================
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - HOMEPAGE_ALLOWED_HOSTS=homepage.${CF_DOMAIN:-localhost},localhost,localhost:3000
      # Expose API keys to Homepage for widgets
      - HOMEPAGE_VAR_SONARR_KEY=${SONARR_API_KEY}
      - HOMEPAGE_VAR_RADARR_KEY=${RADARR_API_KEY}
      - HOMEPAGE_VAR_PROWLARR_KEY=${PROWLARR_API_KEY}
      - HOMEPAGE_VAR_BAZARR_KEY=${BAZARR_API_KEY}
      - HOMEPAGE_VAR_JELLYFIN_KEY=${JELLYFIN_API_KEY}
      - HOMEPAGE_VAR_JELLYSEERR_KEY=${JELLYSEERR_API_KEY}
      - HOMEPAGE_VAR_AUDIOBOOKSHELF_KEY=${AUDIOBOOKSHELF_API_KEY}
      - HOMEPAGE_VAR_QBIT_USERNAME=${ADMIN_USER}
      - HOMEPAGE_VAR_QBIT_PASSWORD=${ADMIN_PASSWORD}
      - HOMEPAGE_VAR_GLUETUN_KEY=${GLUETUN_API_KEY}
      - HOMEPAGE_VAR_DATA_ROOT=${DATA_ROOT}
      - HOMEPAGE_VAR_CF_DOMAIN=${CF_DOMAIN}
    volumes:
      - ./config/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_ROOT}:${DATA_ROOT}:ro
    group_add:
      - "${DOCKER_GID}"  # docker group - gives read access to docker.sock
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # Uptime Kuma - Service Health Monitor
  # WebUI: http://localhost:3001
  # ============================================================
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    volumes:
      - ./config/uptime-kuma:/app/data
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # Audiobookshelf - Audiobook & Podcast Server
  # WebUI: http://localhost:13378
  # Libraries: ${DIR_AUDIOBOOKS}
  # ============================================================
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    environment:
      - TZ=${TZ}
    volumes:
      - ./config/audiobookshelf:/config
      - ./config/audiobookshelf/metadata:/metadata
      - "${DIR_AUDIOBOOKS}:/audiobooks"
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # FlareSolverr - Cloudflare CAPTCHA Bypass Proxy
  # Used by Prowlarr to access indexers behind Cloudflare protection
  # No WebUI needed - runs as a headless browser proxy
  # ============================================================
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # Cloudflared - Cloudflare Tunnel
  # No WebUI - manages outbound tunnel to Cloudflare edge
  # Public hostnames are configured in Zero Trust dashboard:
  #   https://one.dash.cloudflare.com → Networks → Tunnels
  #
  # IMPORTANT: Set CLOUDFLARE_TUNNEL_TOKEN in .env first.
  # See CLOUDFLARE_SETUP.md for full setup guide.
  #
  # Because cloudflared opens an outbound connection to Cloudflare,
  # NO inbound ports need to be opened on your router/firewall.
  # ============================================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    network_mode: "service:gluetun"
    restart: unless-stopped
    profiles:
      - cloudflare
    depends_on:
      gluetun:
        condition: service_healthy
      jellyfin:
        condition: service_started
      jellyseerr:
        condition: service_started
      homepage:
        condition: service_started
      audiobookshelf:
        condition: service_started
      uptime-kuma:
        condition: service_started
